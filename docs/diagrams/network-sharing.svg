<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <rect width="900" height="460" fill="#f8f9fb"/>

  <!-- 来源 -->
  <g font-size="14" fill="#1f2937">
    <rect x="20" y="40" width="200" height="60" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="120" y="64" text-anchor="middle" font-weight="bold">热点客户端</text>
    <text x="120" y="84" text-anchor="middle" font-size="12" fill="#4b5563">10.42.0.0/24</text>

    <rect x="20" y="360" width="200" height="60" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="120" y="384" text-anchor="middle" font-weight="bold">USB reMarkable</text>
    <text x="120" y="404" text-anchor="middle" font-size="12" fill="#4b5563">10.11.99.0/24（rmk0）</text>
  </g>

  <!-- 开关 -->
  <g font-size="14" fill="#1f2937">
    <rect x="280" y="40" width="220" height="60" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="390" y="64" text-anchor="middle" font-weight="bold">hotspot-internet</text>
    <text x="390" y="84" text-anchor="middle" font-size="12" fill="#4b5563">flags/hotspot-direct.yaml</text>

    <rect x="280" y="360" width="220" height="60" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="390" y="384" text-anchor="middle" font-weight="bold">usb-internet</text>
    <text x="390" y="404" text-anchor="middle" font-size="12" fill="#4b5563">flags/usb-direct.yaml</text>
  </g>

  <line x1="220" y1="70" x2="280" y2="70" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="220" y1="390" x2="280" y2="390" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- mihomo 规则判断 -->
  <rect x="560" y="180" width="220" height="100" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="670" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">mihomo rules（置顶）</text>
  <text x="670" y="226" text-anchor="middle" font-size="12" fill="#4b5563">RULE-SET *_direct → DIRECT</text>
  <text x="670" y="246" text-anchor="middle" font-size="12" fill="#4b5563">PUT /providers/rules/&lt;name&gt;</text>
  <text x="670" y="266" text-anchor="middle" font-size="12" fill="#4b5563">刷新后立即生效，无轮询</text>

  <line x1="500" y1="70" x2="670" y2="180" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="390" x2="670" y2="280" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- on/off 分支 -->
  <g font-size="13">
    <rect x="600" y="20" width="270" height="50" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="735" y="40" text-anchor="middle" fill="#166534" font-weight="bold">on：payload: []</text>
    <text x="735" y="58" text-anchor="middle" fill="#166534" font-size="11">→ 并入正常分流，可翻墙</text>

    <rect x="600" y="390" width="270" height="50" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="735" y="410" text-anchor="middle" fill="#991b1b" font-weight="bold">off：SRC-IP-CIDR,&lt;网段&gt;</text>
    <text x="735" y="428" text-anchor="middle" fill="#991b1b" font-size="11">→ 强制 DIRECT，不断网</text>
  </g>

  <line x1="780" y1="200" x2="780" y2="70" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="780" y1="260" x2="780" y2="390" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9ca3af"/>
    </marker>
  </defs>

  <text x="450" y="450" text-anchor="middle" font-size="11" fill="#6b7280">
    脚本改写 flag 文件 → API 刷新 rule-provider → 断存量连接立即生效；状态存于 flag 文件，重启后保持，无需 root
  </text>
</svg>
