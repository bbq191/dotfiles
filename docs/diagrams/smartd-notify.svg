<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <rect width="920" height="320" fill="#f8f9fb"/>

  <text x="460" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">root 权限域</text>
  <text x="460" y="44" text-anchor="middle" font-size="11" fill="#9ca3af">────────────────────────────────────────────</text>

  <!-- root 侧三个方块 -->
  <g font-size="13" fill="#1f2937">
    <rect x="20" y="60" width="200" height="64" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="120" y="86" text-anchor="middle" font-weight="bold">smartd（root）</text>
    <text x="120" y="106" text-anchor="middle" font-size="11" fill="#4b5563">温度/自检异常</text>

    <rect x="270" y="60" width="220" height="64" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="380" y="82" text-anchor="middle" font-weight="bold">smartd_warning.sh</text>
    <text x="380" y="100" text-anchor="middle" font-size="11" fill="#4b5563">-M exec 调用；@notify-desktop</text>
    <text x="380" y="116" text-anchor="middle" font-size="11" fill="#4b5563">摘掉地址，不发邮件</text>

    <rect x="540" y="60" width="220" height="64" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="650" y="82" text-anchor="middle" font-weight="bold">notify-desktop 插件</text>
    <text x="650" y="100" text-anchor="middle" font-size="11" fill="#4b5563">smartd_warning.d/ 下的</text>
    <text x="650" y="116" text-anchor="middle" font-size="11" fill="#4b5563">自定义脚本</text>
  </g>

  <line x1="220" y1="92" x2="270" y2="92" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>
  <line x1="490" y1="92" x2="540" y2="92" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>

  <!-- 权限边界穿越箭头 -->
  <line x1="650" y1="124" x2="650" y2="170" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#b)"/>
  <rect x="500" y="130" width="300" height="34" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="650" y="152" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="bold">sudo -u afu（免密，pam_rootok）—— 跨越权限边界</text>

  <text x="460" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">afu 用户会话</text>

  <g font-size="13" fill="#1f2937">
    <rect x="270" y="210" width="220" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="380" y="234" text-anchor="middle" font-weight="bold">DBUS_SESSION_BUS_ADDRESS</text>
    <text x="380" y="252" text-anchor="middle" font-size="11" fill="#166534">unix:path=/run/user/1000/bus</text>

    <rect x="540" y="210" width="220" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="650" y="230" text-anchor="middle" font-weight="bold">notify-send</text>
    <text x="650" y="248" text-anchor="middle" font-size="11" fill="#166534">org.freedesktop.Notifications</text>
    <text x="650" y="262" text-anchor="middle" font-size="11" fill="#166534">（DMS/Quickshell 注册）</text>
  </g>

  <line x1="650" y1="176" x2="380" y2="210" stroke="#16a34a" stroke-width="2" marker-end="url(#c)"/>
  <line x1="490" y1="240" x2="540" y2="240" stroke="#16a34a" stroke-width="2" marker-end="url(#c)"/>

  <rect x="20" y="284" width="880" height="26" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="460" y="301" text-anchor="middle" font-size="11" fill="#92400e">实测：直接执行插件脚本确认通知能弹出；配置语法用 smartd -d -q onecheck 校验过</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9ca3af"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/></marker>
    <marker id="c" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
  </defs>
</svg>
