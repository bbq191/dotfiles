<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <rect width="900" height="380" fill="#f8f9fb"/>

  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">install.sh</text>
  <g font-size="13" fill="#1f2937">
    <rect x="30"  y="50" width="250" height="60" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="155" y="76" text-anchor="middle" font-weight="bold">① 依赖 + 软件包 + Node</text>
    <text x="155" y="96" text-anchor="middle" font-size="11" fill="#4b5563">paru / stow / packages.txt / fnm</text>

    <rect x="325" y="50" width="250" height="60" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="450" y="76" text-anchor="middle" font-weight="bold">② stow 部署 home/</text>
    <text x="450" y="96" text-anchor="middle" font-size="11" fill="#4b5563">符号链接 + dconf + rime 词库</text>

    <rect x="620" y="50" width="250" height="60" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="745" y="76" text-anchor="middle" font-weight="bold">③ 系统配置 + 服务</text>
    <text x="745" y="96" text-anchor="middle" font-size="11" fill="#4b5563">deploy() → /etc；enable 服务</text>
  </g>

  <line x1="280" y1="80" x2="325" y2="80" stroke="#9ca3af" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="575" y1="80" x2="620" y2="80" stroke="#9ca3af" stroke-width="2" marker-end="url(#a1)"/>

  <!-- 对称箭头 -->
  <line x1="745" y1="110" x2="745" y2="150" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="450" y1="110" x2="450" y2="150" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="155" y1="110" x2="155" y2="150" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>

  <text x="450" y="145" text-anchor="middle" font-size="11" fill="#6b7280">对称撤销 →</text>

  <text x="450" y="185" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">uninstall.sh</text>
  <g font-size="13" fill="#1f2937">
    <rect x="620" y="205" width="250" height="60" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="745" y="231" text-anchor="middle" font-weight="bold">③' 停用服务</text>
    <text x="745" y="251" text-anchor="middle" font-size="11" fill="#4b5563">disable --now 各自定义 unit</text>

    <rect x="325" y="205" width="250" height="60" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="450" y="231" text-anchor="middle" font-weight="bold">②' 删除系统配置</text>
    <text x="450" y="251" text-anchor="middle" font-size="11" fill="#4b5563">drop() 纯附加项（/etc 覆盖文件）</text>

    <rect x="30" y="205" width="250" height="60" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="155" y="231" text-anchor="middle" font-weight="bold">①' stow -D 取消链接</text>
    <text x="155" y="251" text-anchor="middle" font-size="11" fill="#4b5563">仅删符号链接，不动仓库内容</text>
  </g>

  <line x1="620" y1="235" x2="575" y2="235" stroke="#9ca3af" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="325" y1="235" x2="280" y2="235" stroke="#9ca3af" stroke-width="2" marker-end="url(#a1)"/>

  <!-- 不对称提示 -->
  <rect x="30" y="300" width="840" height="60" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="450" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">不对称的三项，uninstall.sh 只打印手动步骤，不自动处理</text>
  <text x="450" y="342" text-anchor="middle" font-size="11" fill="#92400e">PAM 文件（还原会碰包管理所有权）· 已装软件包（批量卸载影响面不可控）· GnuPG/Maven/SDKMAN 的 XDG 数据迁移（避免误删密钥/缓存）</text>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
