# ── 渲染核心 ─────────────────────────────────────────────────────────────────
vo=gpu-next
gpu-api=vulkan
hwdec=nvdec-copy

# ── 画质 ─────────────────────────────────────────────────────────────────────
profile=high-quality
icc-profile-auto=yes
autofit-larger=60%x60%
save-position-on-quit=yes

# ── 语言 / 字幕 ───────────────────────────────────────────────────────────────
alang=zh,chi,chs,sc,zh-CN,ja,jp,jpn,en,eng
slang=zh,chi,chs,sc,zh-CN,zh-TW,tc,ja,jp,jpn,en,eng
sub-auto=fuzzy
sub-ass-force-margins=yes

# ── UOSC UI（禁用原生控件，由 uosc 接管）────────────────────────────────────
# uosc 来自 AUR mpv-uosc，装在 /usr/share/mpv/（该目录不是 mpv 的自动加载目录，需显式指定）；
# 用户级 script-opts/uosc.conf 仍在 ~/.config/mpv 下生效
script=/usr/share/mpv/scripts/uosc
sub-fonts-dir=/usr/share/mpv/fonts
osc=no
osd-bar=no
cursor-autohide=1000
border=no
