# ── 基础操作 ─────────────────────────────────────────────────────────────────
SPACE        cycle pause
ENTER        cycle fullscreen
ESC          set fullscreen no
q            quit

# ── 进度控制 ─────────────────────────────────────────────────────────────────
RIGHT        seek  5
LEFT         seek -5
UP           seek  60
DOWN         seek -60

# ── 音量 ─────────────────────────────────────────────────────────────────────
WHEEL_UP     add volume  5
WHEEL_DOWN   add volume -5
m            cycle mute

# ── 剪贴板播放（Wayland：wl-paste → loadfile）────────────────────────────────
ctrl+v       script-binding load-clipboard

# ── UOSC 右键菜单 ─────────────────────────────────────────────────────────────
MBTN_RIGHT   script-binding uosc/menu
