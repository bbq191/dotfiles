[manager]
ratio          = [1, 2, 4]   # 左:中:右 — 给预览更多空间
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = false        # 按 . 切换
show_symlink   = true
linemode       = "size"
scrolloff      = 5

[preview]
tab_size      = 2
max_width     = 1920
max_height    = 1080
image_filter  = "lanczos3"
image_quality = 75
# kitty 图形协议由 yazi 自动检测，无需显式配置

[opener]
edit = [
  { run = 'nvim "$@"', desc = "Neovim", block = true },
]
open = [
  { run = 'xdg-open "$1"', desc = "Default app" },
]
video = [
  { run = 'mpv "$@"', desc = "mpv" },
]
image_edit = [
  { run = 'satty --filename "$1"', desc = "Satty（标注）" },
  { run = 'xdg-open "$1"',         desc = "Default app" },
]
extract = [
  { run = '7z x -o"${1%.*}" "$1"', desc = "7-Zip 解压" },
  { run = 'unzip "$1"',             desc = "unzip" },
]

[open]
rules = [
  # 文本 / 代码
  { mime = "text/*",           use = ["edit", "open"] },
  { mime = "application/json", use = ["edit", "open"] },
  # 图片 — satty 优先（可直接标注），备选 xdg-open
  { mime = "image/*",          use = ["image_edit", "open"] },
  # 视频
  { mime = "video/*",          use = ["video", "open"] },
  # 音频
  { mime = "audio/*",          use = ["open"] },
  # PDF — 走 xdg-open（mimeapps.list 指向 zathura）
  { mime = "application/pdf",  use = ["open"] },
  # 压缩包
  { mime = "application/zip",               use = ["extract", "open"] },
  { mime = "application/x-tar",            use = ["extract", "open"] },
  { mime = "application/gzip",             use = ["extract", "open"] },
  { mime = "application/x-bzip2",          use = ["extract", "open"] },
  { mime = "application/x-7z-compressed",  use = ["extract", "open"] },
  { mime = "application/x-rar",            use = ["extract", "open"] },
  { mime = "application/x-compressed-tar", use = ["extract", "open"] },
  # 兜底：先尝试编辑，再 xdg-open
  { mime = "*", use = ["edit", "open"] },
]

[tasks]
micro_workers    = 10
macro_workers    = 25
bizarre_retry    = 5
image_alloc      = 536870912   # 512 MB — 缓存图片
image_bound      = [0, 0]
suppress_preload = false

[log]
enabled = false
