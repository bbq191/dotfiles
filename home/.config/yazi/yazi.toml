[manager]
ratio          = [1, 2, 4]   # 左:中:右 — 给预览更多空间
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = false        # 按 . 切换
show_symlink   = true
linemode       = "size"
scrolloff      = 5

[preview]
tab_size      = 2
max_width     = 1920
max_height    = 1080
image_filter  = "lanczos3"
image_quality = 75
# kitty 图形协议由 yazi 自动检测，无需显式配置

[opener]
# "$@"/"$1" 那套位置参数占位符在 yazi v25.12.29 起弃用、v26.9.1 彻底移除，
# 换成下面的 %s（全部选中文件）/ %s1（第一个）新占位符，写 "$@" 不会报错，
# 但也不会被替换成任何文件路径，nvim 会收到零参数直接打开空 buffer——之前
# 遇到的"多选后按 r 打开空文件"就是这个（keymap.toml 里 e 键同理已一并修）
edit = [
  { run = 'nvim %s', desc = "Neovim", block = true },
]
open = [
  { run = 'xdg-open %s1', desc = "Default app" },
]
# 批量重命名（多选后按 r）专用：不指定的话，bulk-rename.txt 走下面 text/* 规则，
# 该规则同时列了 edit/open 两个候选，yazi 会弹"Open with"选择框而不是直接调用编辑器
bulk-rename = [
  { run = 'nvim %s', desc = "Neovim", block = true },
]
video = [
  { run = 'mpv %s', desc = "mpv" },
]
image_edit = [
  { run = 'satty --filename %s1', desc = "Satty（标注）" },
  { run = 'xdg-open %s1',         desc = "Default app" },
]
extract = [
  # %s1 是文本替换，不再是真正的 shell 位置参数，${1%.*} 那种参数展开用不了了，
  # 先赋给变量 f 再展开
  { run = 'f=%s1; 7z x -o"${f%.*}" "$f"', desc = "7-Zip 解压" },
  { run = 'unzip %s1',                     desc = "unzip" },
]

[open]
rules = [
  # 批量重命名临时文件，必须排在 text/* 前面才会命中
  { url = "bulk-rename.txt", use = "bulk-rename" },
  # 文本 / 代码
  { mime = "text/*",           use = ["edit", "open"] },
  { mime = "application/json", use = ["edit", "open"] },
  # 图片 — satty 优先（可直接标注），备选 xdg-open
  { mime = "image/*",          use = ["image_edit", "open"] },
  # 视频
  { mime = "video/*",          use = ["video", "open"] },
  # 音频
  { mime = "audio/*",          use = ["open"] },
  # PDF — 走 xdg-open（mimeapps.list 指向 Brave 内置查看器，zathura 已卸载）
  { mime = "application/pdf",  use = ["open"] },
  # 压缩包
  { mime = "application/zip",               use = ["extract", "open"] },
  { mime = "application/x-tar",            use = ["extract", "open"] },
  { mime = "application/gzip",             use = ["extract", "open"] },
  { mime = "application/x-bzip2",          use = ["extract", "open"] },
  { mime = "application/x-7z-compressed",  use = ["extract", "open"] },
  { mime = "application/x-rar",            use = ["extract", "open"] },
  { mime = "application/x-compressed-tar", use = ["extract", "open"] },
  # 兜底：先尝试编辑，再 xdg-open
  { mime = "*", use = ["edit", "open"] },
]

[tasks]
micro_workers    = 10
macro_workers    = 25
bizarre_retry    = 5
image_alloc      = 536870912   # 512 MB — 缓存图片
image_bound      = [0, 0]
suppress_preload = false

[log]
enabled = false

[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"
