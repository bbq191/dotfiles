# ╔══════════════════════════════════════════════════════════════════╗
# ║  kitty.conf — CachyOS · Hyprland · Wayland · NVIDIA             ║
# ╚══════════════════════════════════════════════════════════════════╝

# ── 字体 ──────────────────────────────────────────────────────────────────────
# Maple Mono NF CN：一套字体覆盖 Nerd Font 图标、中文、连字（calt/liga），无需 fallback
font_family      Maple Mono NF CN
bold_font        Maple Mono NF CN Bold
italic_font      Maple Mono NF CN Italic
bold_italic_font Maple Mono NF CN Bold Italic
# 2560×1600 scale=1（非 HiDPI），13pt 清晰舒适；如觉得偏小可改 14
font_size        11.0

# ── 光标 ──────────────────────────────────────────────────────────────────────
cursor_shape          block
# 关闭光标闪烁，长时间阅读代码时减少干扰
cursor_blink_interval 0

# ── 滚动 ──────────────────────────────────────────────────────────────────────
scrollback_lines 10000
# Ctrl+Shift+H 浏览历史时用 bat 渲染，保留颜色；+G 定位到最新输出
scrollback_pager bat --color=always --style=plain --pager 'less -RS +G'

# ── 鼠标 ──────────────────────────────────────────────────────────────────────
# 选中即复制到系统剪贴板（Wayland clipboard，而非 primary selection）
copy_on_select clipboard
# 在终端内容上 Ctrl+点击可打开 URL
open_url_with default

# ── 透明度 ────────────────────────────────────────────────────────────────────
# 背景透明度，配合 Hyprland 的 blur 产生毛玻璃效果；1.0 = 完全不透明
background_opacity 0.85
# 允许运行时用 Ctrl+Shift+A m/l 动态调节透明度
dynamic_background_opacity yes

# ── 响铃 ──────────────────────────────────────────────────────────────────────
enable_audio_bell    no
visual_bell_duration 0.0

# ── 性能 — 300Hz 显示器 ───────────────────────────────────────────────────────
# repaint_delay（ms）控制最大重绘间隔；4ms ≈ 250fps 上限，匹配 300Hz vsync
repaint_delay   4
# 按键到屏幕的最大延迟（ms），降低输入延迟
input_delay     2
# 锁帧到显示器刷新，避免撕裂
sync_to_monitor yes

# ── 窗口 ──────────────────────────────────────────────────────────────────────
# Hyprland 负责圆角/边框/阴影，kitty 无需自己画标题栏
hide_window_decorations yes
# 内容区内边距，与 hyprland 的 gaps_in=5 视觉上协调
window_padding_width    10
# 记住上次窗口大小（浮动模式下配合 float-persist.py 使用）
remember_window_size    yes

# ── 标签栏 ────────────────────────────────────────────────────────────────────
tab_bar_style       powerline
tab_powerline_style round
# 只有一个标签时隐藏标签栏，最大化可用面积
tab_bar_min_tabs    2

# ── Shell 集成 ────────────────────────────────────────────────────────────────
# 启用后：光标形状跟随 vim normal/insert 模式变化；支持跳转上一个 prompt（Ctrl+Shift+Z）
shell_integration enabled

# ── Wayland / NVIDIA ──────────────────────────────────────────────────────────
# 强制 Wayland 后端，避免 XWayland 路径（N 卡 XWayland 易闪烁）
linux_display_server   wayland
# 标题栏颜色与背景一致，防止 NVIDIA Wayland 下出现颜色不匹配的条带
wayland_titlebar_color background

# ── 配色：Tokyo Night ─────────────────────────────────────────────────────────
# 深蓝底色 + 青/紫高亮，与 hyprland.conf 边框色（#33ccff / #00ff99）视觉风格统一
background           #1a1b26
foreground           #c0caf5
selection_background #283457
selection_foreground #c0caf5
cursor               #c0caf5
cursor_text_color    #1a1b26
url_color            #73daca

# 普通 8 色
color0  #15161e
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6

# 亮色 8 色
color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5

# ── 快捷键 ────────────────────────────────────────────────────────────────────
# 原则：只保留最常用的，与 nvim/vscode 习惯对齐，降低记忆成本

# 粘贴：Ctrl+V（与系统习惯一致，不用记 Ctrl+Shift+V）
map ctrl+v paste_from_clipboard

# 新建窗口/标签时继承当前工作目录
map ctrl+shift+enter launch --cwd=current
map ctrl+shift+t     launch --cwd=current --type=tab

# 滚动历史进 nvim：按下后进入完整 vim 环境
# 选文用 v/V，复制用 y（自动同步系统剪贴板），:q 退出回终端
map ctrl+shift+e launch --stdin-source=@screen_scrollback --stdin-add-formatting --type=overlay nvim -c "setlocal buftype=nofile bufhidden=wipe noswapfile filetype=sh" -
