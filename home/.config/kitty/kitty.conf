# ╔══════════════════════════════════════════════════════════════════╗
# ║  kitty.conf — CachyOS · niri · Wayland · NVIDIA                 ║
# ╚══════════════════════════════════════════════════════════════════╝

# ── 字体 ──────────────────────────────────────────────────────────────────────
# Maple Mono NF CN：一套字体覆盖 Nerd Font 图标、中文、连字（calt/liga），无需 fallback
font_family      Maple Mono NF CN
bold_font        Maple Mono NF CN Bold
italic_font      Maple Mono NF CN Italic
bold_italic_font Maple Mono NF CN Bold Italic
# 2560×1600 scale=1（非 HiDPI），13pt 清晰舒适；如觉得偏小可改 14
font_size        11.0

# ── 光标 ──────────────────────────────────────────────────────────────────────
cursor_shape          block
# 关闭光标闪烁，长时间阅读代码时减少干扰
cursor_blink_interval 0

# ── 滚动 ──────────────────────────────────────────────────────────────────────
scrollback_lines 10000
# Ctrl+Shift+H 浏览历史时用 bat 渲染，保留颜色；+G 定位到最新输出
scrollback_pager bat --color=always --style=plain --pager 'less -RS +G'

# ── 鼠标 ──────────────────────────────────────────────────────────────────────
# 选中即复制到系统剪贴板（Wayland clipboard，而非 primary selection）
copy_on_select clipboard
# 在终端内容上 Ctrl+点击可打开 URL
open_url_with default

# ── 透明度 ────────────────────────────────────────────────────────────────────
# 背景透明度（niri 无 blur，直接透出壁纸）；1.0 = 完全不透明
background_opacity 0.85
# 允许运行时用 Ctrl+Shift+A m/l 动态调节透明度
dynamic_background_opacity yes

# ── 响铃 ──────────────────────────────────────────────────────────────────────
enable_audio_bell    no
visual_bell_duration 0.0

# ── 性能 — 300Hz 显示器 ───────────────────────────────────────────────────────
# repaint_delay（ms）控制最大重绘间隔；4ms ≈ 250fps 上限，匹配 300Hz vsync
repaint_delay   4
# 按键到屏幕的最大延迟（ms），降低输入延迟
input_delay     2
# 锁帧到显示器刷新，避免撕裂
sync_to_monitor yes

# ── 窗口 ──────────────────────────────────────────────────────────────────────
# niri（DMS 托管圆角/边框）负责窗口装饰，kitty 无需自己画标题栏
hide_window_decorations yes
# 内容区内边距，与 niri 的窗口间距（gaps 10）视觉上协调
window_padding_width    10
# 记住上次窗口大小（浮动模式下配合 float-persist.py 使用）
remember_window_size    yes

# ── 标签栏 ────────────────────────────────────────────────────────────────────
tab_bar_style       powerline
tab_powerline_style round
# 只有一个标签时隐藏标签栏，最大化可用面积
tab_bar_min_tabs    2

# ── Shell 集成 ────────────────────────────────────────────────────────────────
# 启用后：光标形状跟随 vim normal/insert 模式变化；支持跳转上一个 prompt（Ctrl+Shift+Z）
shell_integration enabled

# ── Wayland / NVIDIA ──────────────────────────────────────────────────────────
# 强制 Wayland 后端，避免 XWayland 路径（N 卡 XWayland 易闪烁）
linux_display_server   wayland
# 标题栏颜色与背景一致，防止 NVIDIA Wayland 下出现颜色不匹配的条带
wayland_titlebar_color background

# ── 配色（matugen 动态生成，随壁纸变化）────────────────────────────────────────
include ./dank-theme.conf
include ./dank-tabs.conf

# ── 布局 ──────────────────────────────────────────────────────────────────────
# splits 支持任意方向分屏；stack 全屏单窗口；tall/fat 经典主从布局
enabled_layouts splits,stack,tall,fat

# ── 快捷键 ────────────────────────────────────────────────────────────────────
# 修饰键分工：niri=Super  Neovim=Ctrl/Leader  Kitty=Alt
# 循环跳转，无需记忆空间方位；层级记忆：Alt=Tab，Alt+Shift=分屏

# 粘贴
map ctrl+v paste_from_clipboard

# 禁用 kitty 默认的右键粘贴选区（误触频发）
mouse_map right press ungrabbed no_op

# ─ Tab ──────────────────────────────────────────────────────────────────────
# 新建 Tab / 关闭 Tab / 下一 Tab / 上一 Tab
map alt+t           launch --cwd=last_reported --type=tab
map alt+w           close_tab
map alt+shift+]     next_tab
map alt+shift+[     previous_tab
map alt+1       goto_tab 1
map alt+2       goto_tab 2
map alt+3       goto_tab 3
map alt+4       goto_tab 4
map alt+5       goto_tab 5

# ─ 分屏 ─────────────────────────────────────────────────────────────────────
# 新建分屏 / 关闭分屏 / 下一分屏 / 上一分屏
map alt+enter   launch --cwd=last_reported
map alt+q       close_window
map alt+]       next_window
map alt+[       previous_window

# ─ 布局 ─────────────────────────────────────────────────────────────────────
# 切换布局（splits → stack → tall → fat 循环）
map alt+space   next_layout

# ─ 字体大小 ──────────────────────────────────────────────────────────────────
map alt+equal   change_font_size all +1.0
map alt+minus   change_font_size all -1.0
map alt+0       change_font_size all 0

# ─ 滚动历史 → nvim ───────────────────────────────────────────────────────────
# 选文用 v/V，复制用 y（自动同步系统剪贴板），:q 退出回终端
map alt+e launch --stdin-source=@screen_scrollback --stdin-add-formatting --type=overlay nvim -c "setlocal buftype=nofile bufhidden=wipe noswapfile filetype=sh" -
