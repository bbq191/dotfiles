<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- 设置 Maple Mono NF CN 为默认 monospace 字体 -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Maple Mono NF CN</family>
    </prefer>
  </alias>

  <!-- 设置 Maple Mono NF CN 为默认 sans-serif 字体 -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Maple Mono NF CN</family>
    </prefer>
  </alias>

  <!-- 设置 Maple Mono NF CN 为默认 serif 字体 -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Maple Mono NF CN</family>
    </prefer>
  </alias>
</fontconfig>
