################
### MONITORS ###
################

# 内屏：2560x1600 @ 300Hz，缩放比 1（HiDPI 可改为 2）
monitor = eDP-1, 2560x1600@300, auto, 1

###################
### MY PROGRAMS ###
###################

$terminal    = kitty
$fileManager = thunar
$menu        = dms ipc call launcher toggle

#################
### AUTOSTART ###
#################

# hyprpaper：壁纸；fcitx5：输入法；通知由 dms.service（systemd --user）管理
exec-once = hyprpaper & fcitx5 -d --replace
exec-once = python3 ~/.config/hypr/scripts/float-persist.py
# Polkit 认证代理（sudo 弹窗等需要）
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent

#############################
### ENVIRONMENT VARIABLES ###
#############################

# ── NVIDIA ──────────────────────────────────────────────────────────────────
# 强制 VA-API 使用 NVIDIA 驱动（视频硬解）
env = LIBVA_DRIVER_NAME, nvidia
# 强制 GBM 后端使用 NVIDIA DRM（Wayland 渲染核心）
env = GBM_BACKEND, nvidia-drm
# 强制 GLX 使用 NVIDIA 厂商库，避免 Mesa 接管
env = __GLX_VENDOR_LIBRARY_NAME, nvidia

# ── Electron 应用（VS Code 等）──────────────────────────────────────────────
# auto：让 Electron 自动选择 Wayland/X11，避免 N 卡闪烁
env = ELECTRON_OZONE_PLATFORM_HINT, auto

# ── 输入法 ───────────────────────────────────────────────────────────────────
# Wayland 原生应用（GTK4/Qt6）通过 Wayland Input Method Protocol 自动使用 fcitx5
# 不设置 GTK_IM_MODULE / QT_IM_MODULE（GTK4 不支持，且会与 Wayland IM 协议冲突）
# XMODIFIERS 仅供 XWayland 应用使用
env = XMODIFIERS, @im=fcitx

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in  = 5
    gaps_out = 20
    border_size = 2

    col.active_border   = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # 允许拖拽边框/间距来调整窗口大小
    resize_on_border = true

    # 开启会在特定场景下绕过合成器直接渲染（可能撕裂），保持关闭
    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding       = 10
    rounding_power = 2

    active_opacity   = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled      = true
        range        = 4
        render_power = 3
        color        = rgba(1a1a1aee)
    }

    blur {
        enabled   = true
        size      = 3
        passes    = 1
        vibrancy  = 0.1696
    }
}

animations {
    enabled = true

    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1, 10,   default
    animation = border,        1, 5.39, easeOutQuint
    animation = windows,       1, 4.79, easeOutQuint
    animation = windowsIn,     1, 4.1,  easeOutQuint, popin 87%
    animation = windowsOut,    1, 1.49, linear,       popin 87%
    animation = fadeIn,        1, 1.73, almostLinear
    animation = fadeOut,       1, 1.46, almostLinear
    animation = fade,          1, 3.03, quick
    animation = layers,        1, 3.81, easeOutQuint
    animation = layersIn,      1, 4,    easeOutQuint, fade
    animation = layersOut,     1, 1.5,  linear,       fade
    animation = fadeLayersIn,  1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces,    1, 1.94, almostLinear, fade
    animation = workspacesIn,  1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
    animation = zoomFactor,    1, 7,    quick
}

dwindle {
    preserve_split = true  # 保持已有分割方向，不随焦点改变
}

misc {
    # 已用 hyprpaper 管理壁纸，禁用内置默认壁纸
    force_default_wallpaper = 0
    disable_hyprland_logo   = true
}

#############
### INPUT ###
#############

input {
    kb_layout = us

    # 所有窗口点击才聚焦（新窗口打开时自动聚焦不受影响）
    follow_mouse              = 0
    float_switch_override_focus = 0
    accel_profile  = flat
    sensitivity    = 0
    natural_scroll = true

    touchpad {
        natural_scroll = true
    }
}

# 三指横扫切换工作区
gesture = 3, horizontal, workspace

cursor {
    use_cpu_buffer = true   # NVIDIA: 光标纹理用 CPU buffer，防止纹理撕裂
}


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# ── 应用启动 ─────────────────────────────────────────────────────────────────
bind = $mainMod,       Q, exec, $terminal
bind = $mainMod,       E, exec, $fileManager
bind = $mainMod,       R, exec, $menu

# ── 窗口管理 ─────────────────────────────────────────────────────────────────
bind = $mainMod,       C,       killactive
bind = $mainMod,       V,       togglefloating
bind = $mainMod,       P,       pseudo          # dwindle 伪平铺
bind = $mainMod SHIFT, J,       layoutmsg, togglesplit  # dwindle 切换分割方向

# ── 退出 ─────────────────────────────────────────────────────────────────────
bind = $mainMod,       M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit

# ── Alt+Tab 窗口切换（跨 workspace 自动跟随）────────────────────────────────
bind = ALT,       Tab, exec, hyprswitch simple
bind = ALT SHIFT, Tab, exec, hyprswitch simple --reverse

# ── 焦点移动（hjkl）────────────────────────────────────────────────────────
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# ── 工作区切换 ────────────────────────────────────────────────────────────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# ── 移动窗口到工作区 ──────────────────────────────────────────────────────────
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# ── 特殊工作区（便签本）──────────────────────────────────────────────────────
bind = $mainMod,       S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace,        special:magic

# ── 鼠标滚轮切换工作区 ────────────────────────────────────────────────────────
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# ── 鼠标拖拽移动/缩放窗口 ────────────────────────────────────────────────────
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ── 截图：单次框选，同时复制到剪贴板并在 satty 中标注 ────────────────────────
bind = $mainMod, A, exec, sh -c 'grim -g "$(slurp)" /tmp/hypr-ss.png && wl-copy < /tmp/hypr-ss.png && satty -f /tmp/hypr-ss.png'

# ── 锁屏 ─────────────────────────────────────────────────────────────────────
bind = $mainMod SHIFT, L, exec, dms ipc call lock lock

# ── 多媒体键 ──────────────────────────────────────────────────────────────────
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume    @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@   toggle
bindel = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPrev,  exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    # 忽略所有应用的最大化请求，由 Hyprland 自己管理窗口状态
    name      = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    # 文件对话框（GTK xdg-desktop-portal）始终居中，防止超出屏幕
    name        = center-file-portal
    match:class = ^xdg-desktop-portal-gtk$
    center      = yes
    float       = yes
}

windowrule {
    # 按标题匹配另存/上传/下载/打开等系统弹窗，始终居中
    name        = center-title-dialogs
    match:title = ^(Open|Save|Save As|另存为|打开|Open File|Save File|Select File|Upload|Download).*$
    match:float = true
    center      = yes
}

windowrule {
    # XWayland 拖拽 bug 修复：无类名的浮动 XWayland 窗口不抢占焦点
    name           = fix-xwayland-drags
    match:class    = ^$
    match:title    = ^$
    match:xwayland = true
    match:float    = true
    match:fullscreen = false
    match:pin      = false
    no_focus       = true
}

windowrule {
    # hyprland-run 弹出终端固定在屏幕左下角
    name        = move-hyprland-run
    match:class = hyprland-run
    move        = 20 monitor_h-120
    float       = yes
}

windowrule {
    # satty 截图标注工具以浮动窗口打开
    name        = satty
    match:class = com.gabm.satty
    float       = yes
}


windowrule {
    name        = float-dms-setting
    match:class = ^org\.quickshell$
    float       = yes
}

windowrule {
    name        = float-thunar
    match:class = ^thunar$
    float       = yes
}

windowrule {
    name        = float-telegram
    match:class = ^org\.telegram\.desktop$
    float       = yes
}

windowrule {
    name        = float-wechat
    match:class = ^wechat$
    float       = yes
}

windowrule {
    # 网络连接编辑器（nm-connection-editor）
    name        = float-nm-connection-editor
    match:class = ^nm-connection-editor$
    float       = yes
}

windowrule {
    # 蓝牙管理（blueman、blueberry）
    name        = float-bluetooth
    match:class = ^(blueman-manager|blueberry)$
    float       = yes
}

windowrule {
    # VS Code Insiders — 与 kitty background_opacity 0.85 保持一致
    name            = vscode-opacity
    match:class     = ^code-insiders$
    opacity         = 0.75 0.75
}

windowrule {
    # VS Code Insiders — 与 kitty background_opacity 0.85 保持一致
    name            = browser-opacity
    match:class     = ^librewolf$
    opacity         = 0.80 0.80
}

windowrule {
    name        = float-mpv
    match:class = ^mpv$
    float       = yes
    size        = 800 450
}
windowrule {
    name           = arknights
    match:class    = ^steam_app_default$
    float          = yes
}

##############
### SOURCE ###
##############

source = ./dms/cursor.conf
source = ./dms/outputs.conf
