proxy-providers:
  Flower:
    url: "https://yours?token2=__MIHOMO_TOKEN__&sip002=1"
    type: http
    interval: 0
    icon: "https://cdn.jsdelivr.net/gh/bbq191/my-rules/main/icons/Policy-Provider/Flowercloud.png"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 120
    proxy: DIRECT

# 全局配置
log-level: warning
mixed-port: 6153
ipv6: false
bind-address: "*"
allow-lan: true
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

external-controller: 127.0.0.1:9090
external-ui: ui
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"
secret: "__MIHOMO_SECRET__"

# 地址嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
    - "+.baidu.com"
    - "iam.picc.com"

tun:
  enable: true
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  inet4-route-exclude-address:
    # 特定工作地址
    - 10.0.0.0/8
    - 30.0.0.0/8
    - 40.0.0.0/8
    - 130.0.1.30/32
    - 192.168.0.0/24
    - 192.168.240.0/24 # Waydroid
    - 172.16.0.0/12

dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  respect-rules: true
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:fakeipfilter_domain"
    - "iam.picc.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 只用 UDP，避免 respect-rules 下 DoH 域名解析循环
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    # 内网域名使用内网 DNS
    "iam.picc.com": 10.30.15.249

proxy-groups:
  # 社交
  - name: Telegram
    type: select
    proxies: [新加坡, 香港, 日本]
    icon: "https://cdn.jsdelivr.net/gh/bbq191/my-rules/main/icons/Policy-Filter/Telegram.png"

  - name: 巴哈姆特
    type: select
    proxies: [台湾, 香港]
    icon: "https://cdn.jsdelivr.net/gh/bbq191/my-rules/main/icons/Policy-Filter/Bahamut.png"

  - name: Games
    type: select
    proxies: [香港, 日本, 新加坡]
    icon: "https://cdn.jsdelivr.net/gh/bbq191/my-rules/main/icons/Policy-Filter/Games.png"

  # 流媒体
  - name: YouTube
    type: select
    proxies: [美国, 香港, 日本, 新加坡]
    icon: "https://cdn.jsdelivr.net/gh/bbq191/my-rules/main/icons/Policy-Filter/YouTube.png"

  # 厂商
  - name: AI
    type: select
    proxies: [美国, 香港]
    icon: "https://cdn.jsdelivr.net/gh/bbq191/my-rules/main/icons/Policy-Filter/AI.png"

  - name: Github
    type: select
    proxies: [香港, 美国, DIRECT]
    icon: "https://cdn.jsdelivr.net/gh/bbq191/my-rules/main/icons/Policy-Filter/Github.png"

  - name: Apple
    type: select
    proxies: [美国, 香港, DIRECT]
    icon: "https://cdn.jsdelivr.net/gh/bbq191/my-rules/main/icons/Policy-Filter/Apple.png"

  - name: Microsoft
    type: select
    proxies: [美国, 香港, DIRECT]
    icon: "https://cdn.jsdelivr.net/gh/bbq191/my-rules/main/icons/Policy-Filter/Microsoft.png"

  - name: Google
    type: select
    proxies: [美国, 香港, 日本, 台湾]
    icon: "https://cdn.jsdelivr.net/gh/bbq191/my-rules/main/icons/Policy-Filter/Google.png"

  #------- 分隔,下面是地区分组（url-test 自动选最低延迟）
  - name: 国内
    type: select
    proxies: [DIRECT, 全部节点]
    icon: "https://cdn.jsdelivr.net/gh/bbq191/my-rules/main/icons/Policy-Country/CN.png"

  - name: 香港
    type: url-test
    include-all: true
    exclude-type: direct
    filter: "(?i)香港|hk|hongkong|hong kong"
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    icon: "https://cdn.jsdelivr.net/gh/bbq191/my-rules/main/icons/Policy-Country/HK.png"

  - name: 台湾
    type: url-test
    include-all: true
    exclude-type: direct
    filter: "(?i)台湾|tw|taiwan"
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    icon: "https://cdn.jsdelivr.net/gh/bbq191/my-rules/main/icons/Policy-Country/TW.png"

  - name: 日本
    type: url-test
    include-all: true
    exclude-type: direct
    filter: "(?i)日本|jp|japan"
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    icon: "https://cdn.jsdelivr.net/gh/bbq191/my-rules/main/icons/Policy-Country/JP.png"

  - name: 美国
    type: url-test
    include-all: true
    exclude-type: direct
    filter: "(?i)美|us|unitedstates|united states"
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    icon: "https://cdn.jsdelivr.net/gh/bbq191/my-rules/main/icons/Policy-Country/US.png"

  - name: 新加坡
    type: url-test
    include-all: true
    exclude-type: direct
    filter: "(?i)(新加坡|sg|singapore)"
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    icon: "https://cdn.jsdelivr.net/gh/bbq191/my-rules/main/icons/Policy-Country/SG.png"

  - name: 其它地区
    type: select
    include-all: true
    exclude-type: direct
    filter: "(?i)^(?!.*(?:Expire|Traffic|失联|自动|最优|网站|地址|剩余|过期|时间|有效|🇭🇰|🇯🇵|🇺🇸|🇸🇬|🇨🇳|香港|hk|hongkong|台湾|tw|taiwan|日本|jp|japan|新|sg|singapore|美|us|unitedstates)).*"
    icon: "https://cdn.jsdelivr.net/gh/bbq191/my-rules/main/icons/Policy-Country/Other.png"

  - name: 全部节点
    type: select
    include-all: true
    exclude-type: direct
    filter: "(?i)^(?!.*(?:失联|自动|最优|网站|地址|剩余|过期|时间|有效)).*"
    icon: "https://cdn.jsdelivr.net/gh/bbq191/my-rules/main/icons/Policy-Country/All.png"

rules:
  # 工作内网 IP
  #- IP-CIDR,30.0.0.0/8,DIRECT
  #- IP-CIDR,40.0.0.0/8,DIRECT

  # 工作应用域名
  - DOMAIN-SUFFIX,lanxin.cn,国内
  - DOMAIN-SUFFIX,qianxin.com,国内
  - PROCESS-NAME,LxMainNew.exe,国内

  # 国际服
  - PROCESS-NAME,PathOfExile.exe,Games
  - DOMAIN-SUFFIX,gryphline.com,Games

  # 国内服
  - PROCESS-NAME,Echoes of Vision.exe,国内
  - DOMAIN-SUFFIX,astral-vector.com,国内

  - DOMAIN-SUFFIX,local,DIRECT
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,ai_domain,AI
  - RULE-SET,github_domain,Github
  - RULE-SET,youtube_domain,YouTube
  - RULE-SET,google_domain,Google
  - RULE-SET,apple_domain,Apple
  - RULE-SET,microsoft_domain,Microsoft
  - RULE-SET,telegram_domain,Telegram
  - RULE-SET,category-games_domain,Games
  - RULE-SET,category-game-platforms-download_domain,Games
  - RULE-SET,playstation_domain,Games
  - RULE-SET,bahamut_domain,巴哈姆特
  - RULE-SET,ads_domain,REJECT
  - RULE-SET,ads@ads_domain,REJECT
  - RULE-SET,geolocation-!cn,全部节点

  - RULE-SET,google_ip,Google,no-resolve
  - RULE-SET,telegram_ip,Telegram,no-resolve
  - RULE-SET,cn_domain,国内
  - RULE-SET,cn_ip,国内
  - MATCH,全部节点

rule-anchor:
  ip: &ip { type: http, interval: 86400, behavior: ipcidr, format: mrs }
  domain: &domain { type: http, interval: 86400, behavior: domain, format: mrs }
rule-providers:
  fakeipfilter_domain:
    <<: *domain
    url: "https://cdn.jsdelivr.net/gh/wwqgtxx/clash-rules/release/fakeip-filter.mrs"
  ads_domain:
    <<: *domain
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads.mrs"
  ads@ads_domain:
    <<: *domain
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads@ads.mrs"
  private_domain:
    <<: *domain
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs"
  category-games_domain:
