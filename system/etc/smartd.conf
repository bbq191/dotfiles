# 只监控本机现有的 NVMe 盘（SK hynix 2048GB）。DEVICESCAN 对 NVMe 的自动发现/
# 参数支持不如显式声明可靠，换盘/加盘时记得同步这里（lsblk -d -o NAME,MODEL,TRAN 核对）。
#
# -a          开启全部监控（属性、健康状态、日志、自检结果、错误日志）
# -W 5,70,80  温度滞回 5°C，超过 70°C 记警告、超过 80°C 记严重。原定 45/55 部署后
#             实测本机 NVMe 空载就有 49°C，一启用就误报，改成更贴近真实阈值的档位
#             （消费级 NVMe 常见的告警/临界温度区间，本机没能读到该盘自报的
#             WCTEMP/CCTEMP 具体值来精确对齐，用的是保守通用经验值）
# -s ...      每天 02:00 短自检，每周六 03:00 长自检
#
# -m '@notify-desktop' -M exec ...：不发邮件（本机没有 MTA），走 smartmontools 自带的
# 插件机制。@notify-desktop 会在真正发信前被摘掉，剩余地址列表为空，wrapper 就不会
# 再尝试调用 mail，只跑插件脚本 usr/share/smartmontools/smartd_warning.d/notify-desktop
# （sudo -u afu 把通知打到 DMS/Quickshell 的会话总线）。异常同时仍会记 journal。
/dev/nvme0n1 -a -W 5,70,80 -s (S/../.././02|L/../../6/03) \
    -m '@notify-desktop' -M exec /usr/share/smartmontools/smartd_warning.sh
