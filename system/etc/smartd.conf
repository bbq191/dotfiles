# 只监控本机现有的 NVMe 盘（SK hynix 2048GB）。DEVICESCAN 对 NVMe 的自动发现/
# 参数支持不如显式声明可靠，换盘/加盘时记得同步这里（lsblk -d -o NAME,MODEL,TRAN 核对）。
#
# -a          开启全部监控（属性、健康状态、日志、自检结果、错误日志）
# -W 5,45,55  温度滞回 5°C，超过 45°C 记警告、超过 55°C 记严重（NVMe 桌面/笔记本盘常见阈值）
# -s ...      每天 02:00 短自检，每周六 03:00 长自检
#
# 无 -M（不配邮件/exec 通知）：本机没有 MTA，也不打算为 root 服务搭 D-Bus 通知桥，
# 异常走默认行为记 journal，需要时 `journalctl -u smartd` 查看，或 `smartctl -a /dev/nvme0n1` 手动核对
/dev/nvme0n1 -a -W 5,45,55 -s (S/../.././02|L/../../6/03)
