# Allow members of the video group to read howdy config/models (needed for
# user-space PAM callers such as the DMS lock screen).
# howdy add/clear (re-)creates *.dat as 600 root:root, which the unprivileged
# DMS lock screen process cannot read -- re-apply after every re-enrollment.
Z /etc/howdy         0750 root video -
Z /etc/howdy/models  0750 root video -
z /etc/howdy/config.ini 0640 root video -
z /etc/howdy/models/*.dat 0640 root video -
