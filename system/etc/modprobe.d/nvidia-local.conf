# Enable NVIDIA GPU participation in S0ix (s2idle) sleep.
# The system sleep state is already s2idle; without this the GPU stays active
# during suspend and drains battery. Requires:
#   - NVreg_UseKernelSuspendNotifiers=1 (nvidia-sleep.conf, system-provided)
#   - NVreg_PreserveVideoMemoryAllocations != 0 (already set, driver default)
options nvidia NVreg_EnableS0ixPowerManagement=1
