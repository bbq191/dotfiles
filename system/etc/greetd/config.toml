[terminal]
# The VT to run the greeter on. Can be "next", "current" or a number
# designating the VT.
vt = 1

# The default session, also known as the greeter.
[default_session]

# `agreety` is the bundled agetty/login-lookalike. You can replace `/bin/sh`
# with whatever you want started, such as `sway`.
# NVIDIA 环境变量前缀：greeter 用户读不到 afu 的 niri config.kdl（home 是 /），
# 拿不到 environment{} 里的 GBM_BACKEND 等变量，导致登录界面这个 niri 实例
# 没有强制走 nvidia-drm，eDP 面板的 DRM connector 命名（eDP-1/eDP-2）跟登录后
# 的用户会话不一致，表现为登录界面分辨率跟锁屏不一样
command = "env GBM_BACKEND=nvidia-drm LIBVA_DRIVER_NAME=nvidia __GLX_VENDOR_LIBRARY_NAME=nvidia /usr/bin/dms-greeter --command niri --cache-dir /var/cache/dms-greeter"

# The user to run the command as. The privileges this user must have depends
# on the greeter. A graphical greeter may for example require the user to be
# in the `video` group.
user = "greeter"
