  telegram_ip:
    <<: *ip
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geoip/telegram.mrs"

  # 外网开关标志(本地文件,由 hotspot-internet / usb-internet 脚本管理)
  hotspot_direct:
    type: file
    behavior: classical
    format: yaml
    path: ./flags/hotspot-direct.yaml
  usb_direct:
    type: file
    behavior: classical
    format: yaml
    path: ./flags/usb-direct.yaml
