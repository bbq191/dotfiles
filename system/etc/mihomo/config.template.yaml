proxy-providers:
  Flower:
    url: "__MIHOMO_SUB_URL__"
    type: http
    interval: 0
    icon: "https://raw.githubusercontent.com/bbq191/my-rules/main/icons/Policy-Provider/Flowercloud.png"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 120
    proxy: DIRECT

# 全局配置
log-level: warning
mixed-port: 6153
ipv6: false
bind-address: "*"
allow-lan: true
unified-delay: true
tcp-concurrent: true
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

external-controller: 127.0.0.1:9090
external-ui: ui
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"
secret: "__MIHOMO_SECRET__"

# 地址嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
    - "+.baidu.com"
    - "iam.picc.com"

tun:
  enable: true
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: false
  auto-detect-interface: true
  inet4-route-exclude-address:
    # 特定工作地址
    - 10.0.0.0/8
    - 30.0.0.0/8
    - 40.0.0.0/8
    - 130.0.1.30/32
    - 192.168.0.0/24
    - 192.168.240.0/24 # Waydroid
    - 172.16.0.0/12

dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  respect-rules: true
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:fakeipfilter_domain"
    - "iam.picc.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 只用 UDP，避免 respect-rules 下 DoH 域名解析循环
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    # 内网域名使用内网 DNS
    "iam.picc.com": 10.30.15.249

proxy-groups:
  # 社交
  - name: Telegram
    type: select
    proxies: [新加坡, 香港, 日本]
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Telegram.png"

  - name: 巴哈姆特
    type: select
    proxies: [台湾, 香港]
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Bahamut.png"

  - name: Games
    type: select
    proxies: [香港, 日本, 新加坡, DIRECT]
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Game.png"

  # 流媒体
  - name: YouTube
    type: select
    proxies: [美国, 香港, 日本, 新加坡]
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/YouTube.png"

  - name: GlobalMedia
    type: select
    proxies: [美国, 香港, 日本, 台湾, 新加坡]
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Stream.png"

  # 厂商
  - name: AI
    type: select
    proxies: [美国, 香港]
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/AI.png"

  - name: Github
    type: select
    proxies: [香港, 美国, DIRECT]
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/GitHub.png"

  - name: Apple
    type: select
    proxies: [美国, 香港, DIRECT]
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Apple.png"

  - name: Microsoft
    type: select
    proxies: [美国, 香港, DIRECT]
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Microsoft.png"

  - name: Google
    type: select
    proxies: [美国, 香港, 日本, 台湾]
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Google.png"

  #------- 分隔,下面是地区分组（select 手动选择，按国旗 emoji / 中文 / 带边界的英文缩写过滤）
  - name: 国内
    type: select
    proxies: [DIRECT, 全部节点]
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/China.png"

  - name: Advertising
    type: select
    proxies: [REJECT, DIRECT]
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Adblock.png"

  - name: 香港
    type: select
    include-all: true
    exclude-type: direct
    filter: '(?i)🇭🇰|香港|\bhk(?![a-z])|hong ?kong'
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Hong_Kong.png"

  - name: 台湾
    type: select
    include-all: true
    exclude-type: direct
    filter: '(?i)🇹🇼|台湾|\btw(?![a-z])|taiwan'
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Taiwan_Province.png"

  - name: 日本
    type: select
    include-all: true
    exclude-type: direct
    filter: '(?i)🇯🇵|日本|\bjp(?![a-z])|japan'
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Japan.png"

  - name: 美国
    type: select
    include-all: true
    exclude-type: direct
    filter: '(?i)🇺🇸|美国|\bus(?![a-z])|\busa(?![a-z])|united ?states'
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/USA.png"

  - name: 新加坡
    type: select
    include-all: true
    exclude-type: direct
    filter: '(?i)🇸🇬|新加坡|狮城|\bsg(?![a-z])|singapore'
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Singapore.png"

  - name: 其它地区
    type: select
    include-all: true
    exclude-type: direct
    filter: '(?i)^(?!.*(?:Expire|Traffic|失联|自动|最优|网站|地址|剩余|过期|时间|有效|🇭🇰|🇹🇼|🇯🇵|🇺🇸|🇸🇬|🇨🇳|香港|\bhk(?![a-z])|hong ?kong|台湾|\btw(?![a-z])|taiwan|日本|\bjp(?![a-z])|japan|新加坡|狮城|\bsg(?![a-z])|singapore|美国|\bus(?![a-z])|\busa(?![a-z])|united ?states)).*'
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Other.png"

  - name: 全部节点
    type: select
    include-all: true
    exclude-type: direct
    filter: '(?i)^(?!.*(?:失联|自动|最优|网站|地址|剩余|过期|时间|有效)).*'
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Global.png"

rules:
  # 外网开关:flag 文件含 SRC-IP-CIDR 时,对应来源全部 DIRECT(不可翻墙但有网)。
  # 由 hotspot-internet / usb-internet 脚本改写 flag 并经 API 刷新,勿手动编辑。
  - RULE-SET,hotspot_direct,DIRECT
  - RULE-SET,usb_direct,DIRECT
  # 工作内网 IP
  #- IP-CIDR,30.0.0.0/8,DIRECT
  #- IP-CIDR,40.0.0.0/8,DIRECT

  # 工作应用域名
  - DOMAIN-SUFFIX,lanxin.cn,国内
  - DOMAIN-SUFFIX,qianxin.com,国内
  - PROCESS-NAME,LxMainNew.exe,国内

  # 国际服
  - DOMAIN-SUFFIX,gryphline.com,Games

  # 国内服
  - DOMAIN-SUFFIX,astral-vector.com,国内

  - DOMAIN-SUFFIX,local,DIRECT
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,private_domain,DIRECT
  # 广告拦截必须在厂商规则之前：google.mrs 本身包含 doubleclick 等广告域名
  - RULE-SET,ads_domain,Advertising
  - RULE-SET,ads@ads_domain,Advertising
  # DeepSeek 是国内直连 API：必须在 ai_domain 之前抢先走「国内」直连。
  # 否则被 category-ai-!cn 匹配 → AI 代理(美/港) → 国内 API 绕道境外又慢又飘；
  # 且 fake-ip 经 TUN 走代理时，reMarkable 设备(借本机 DNS+NAT)的大图上传直接超时
  # (2026-08-30 cang-jie cardhw 真机实测：deepseek 180s 打满超时，dashscope 直连秒回)。
  - DOMAIN-SUFFIX,deepseek.com,国内
  - RULE-SET,ai_domain,AI
  - RULE-SET,github_domain,Github
  - RULE-SET,youtube_domain,YouTube
  - RULE-SET,netflix_domain,GlobalMedia
  - RULE-SET,disney_domain,GlobalMedia
  - RULE-SET,hbo_domain,GlobalMedia
  - RULE-SET,primevideo_domain,GlobalMedia
  - RULE-SET,spotify_domain,GlobalMedia
  - RULE-SET,google_domain,Google
  - RULE-SET,apple_domain,Apple
  - RULE-SET,microsoft_domain,Microsoft
  - RULE-SET,telegram_domain,Telegram
  # 国内游戏（Steam 国区 CDN 等）先直连；category-games 也含 mihoyo/4399 等国内域名，其余靠 Games 组的 DIRECT
  - RULE-SET,category-games@cn_domain,国内
  - RULE-SET,category-games_domain,Games
  - RULE-SET,category-game-platforms-download_domain,Games
  - RULE-SET,playstation_domain,Games
  - RULE-SET,bahamut_domain,巴哈姆特
  - RULE-SET,geolocation-!cn,全部节点

  - RULE-SET,google_ip,Google,no-resolve
  - RULE-SET,telegram_ip,Telegram,no-resolve
  - RULE-SET,cn_domain,国内
  - RULE-SET,cn_ip,国内
  - MATCH,全部节点

rule-anchor:
  ip: &ip { type: http, interval: 86400, behavior: ipcidr, format: mrs }
  domain: &domain { type: http, interval: 86400, behavior: domain, format: mrs }
rule-providers:
  fakeipfilter_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/wwqgtxx/clash-rules/release/fakeip-filter.mrs"
  ads_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/category-ads.mrs"
  ads@ads_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/category-ads@ads.mrs"
  private_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/private.mrs"
  category-games@cn_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/category-games@cn.mrs"
  category-games_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/category-games.mrs"
  category-game-platforms-download_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/category-game-platforms-download.mrs"
