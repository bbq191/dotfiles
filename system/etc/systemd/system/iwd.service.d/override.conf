# iwd 有时会在 CachyOS 的 cachyos-iw-set-regdomain.service（由 wifi phy0 设备
# 出现触发，cachyos-settings 包自带）设置好 regulatory domain 之前就去查询它，
# 触发内核 WARN：
#   !regdom && self_managed
#   WARNING: net/wireless/nl80211.c:10576 at nl80211_get_reg_do ... CPU#.., iwd/...
# 实测近 4 次开机 3 次命中（journalctl -k 搜 nl80211_get_reg_do）。只是内核 WARN，
# 不是崩溃，但两边都没有显式启动顺序约束，纯属谁跑得快的竞态。
# 只用 After（不用 Requires）：约束顺序，不强制拉起对方；对方没触发时 iwd 启动不受影响。
[Unit]
After=cachyos-iw-set-regdomain.service
