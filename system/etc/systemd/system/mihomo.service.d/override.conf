# mihomo-bin 自带单元给了 7 个能力，但当前配置（TUN 代理 + DNS 1053 + API 9090，
# 均非特权端口）实际只用到 NET_ADMIN（建 TUN、改路由）/ NET_RAW（部分代理协议用
# 原始套接字）；NET_BIND_SERVICE 留着不去掉，成本低、给以后万一要绑 <1024 端口
# 留余地。以 root 身份跑，去掉 DAC_OVERRIDE/DAC_READ_SEARCH 后就要遵守正常文件
# 权限位而不是无条件绕过——config.yaml（root:afu 640，root 是属主）和 flags/*.yaml
# （afu 所有但默认 644 全局可读）都不受影响。SYS_PTRACE/SYS_TIME 对代理功能没有
# 任何已知用途，是这份清单里风险最高的两个（前者理论上可读取其他进程内存）。
#
# 这个改动没能在部署环境里实测验证（sudo 需要交互输入密码，工具沙箱里拿不到），
# 应用后请务必 `sudo systemctl daemon-reload && sudo systemctl restart mihomo`
# 然后检查 `systemctl status mihomo` 和实际代理是否正常；出问题就删掉这个文件回滚：
# `sudo rm /etc/systemd/system/mihomo.service.d/override.conf && sudo systemctl daemon-reload && sudo systemctl restart mihomo`
[Service]
CapabilityBoundingSet=
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW CAP_NET_BIND_SERVICE
AmbientCapabilities=
AmbientCapabilities=CAP_NET_ADMIN CAP_NET_RAW CAP_NET_BIND_SERVICE
